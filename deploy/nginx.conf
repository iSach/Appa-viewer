# Static hosting for the viewer + published data. No dynamic code anywhere.
# Needs: Range requests (nginx does this by default for static files) and gzip for json.
server {
    listen 80;
    server_name _;
    root /var/www/appa/web;          # contents of web/, with data/ inside it (or a symlink to it)
    index index.html;

    gzip on;
    gzip_types application/json text/css text/javascript;

    # Pointers change every run: never cache them.
    location ~ ^/data/(latest|runs)\.json$ { add_header Cache-Control "no-store"; }
    location ~ ^/data/runs/[^/]+/(manifest|verification)\.json$ { add_header Cache-Control "no-cache"; }

    # Packs and point files are immutable per run id: cache them for good.
    # Do NOT gzip them (PNG is already compressed; uint16 point files are fetched by byte range).
    location ~ ^/data/runs/.+\.(pack|u16)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip off;
    }

    # The viewer itself revalidates on every load, so new code is picked up immediately.
    location ~ \.(js|css|html)$ { add_header Cache-Control "no-cache"; }
}
